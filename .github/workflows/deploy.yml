# Required GitHub Secrets:
# - HOMESERVER_TS_IP: Tailscale IP (100.x.x.x)
# - TS_OAUTH_CLIENT_ID: Tailscale OAuth client ID
# - TS_OAUTH_SECRET: Tailscale OAuth secret
# - USERNAME: SSH username on homeserver
# - SSH_PRIVATE_KEY: SSH private key for deployment
#
# Homeserver prerequisites:
# - Docker registry running on port 5000 (docker run -d -p 5000:5000 --restart always --name registry registry:2)
# - ~/workspace/neuti-site/.env with production environment variables
# - Tailscale ACL tag:ci configured

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.HOMESERVER_TS_IP }}:5000

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Registry traffic is encrypted via Tailscale VPN (100.x.x.x network)
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.HOMESERVER_TS_IP }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."${{ secrets.HOMESERVER_TS_IP }}:5000"]
              http = true
              insecure = true

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/neuti-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/neuti-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/neuti-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/neuti-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Copy compose file to homeserver
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOMESERVER_TS_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: ~/workspace/neuti-site

      # backend/uploads 는 .dockerignore 로 이미지에서 제외되고, 운영에서는 호스트
      # 디렉터리를 /app/uploads 로 bind mount 한다(docker-compose.prod.yml).
      # 따라서 git 에 커밋한 시공사례 이미지는 이 단계에서 직접 동기화하지 않으면
      # 운영에 영원히 도달하지 않는다 (본문은 뜨는데 이미지만 404 나는 원인).
      #
      # --delete 는 절대 쓰지 말 것: 같은 디렉터리에 관리자 UI 로 업로드된
      # 파일(uuid.jpg)이 함께 있고, 그건 git 에 없으므로 지워진다.
      # 대신 rsync 뒤에서 '저장소에 없는 하위 디렉터리'만 골라 정리한다.
      - name: Sync uploads to homeserver
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.HOMESERVER_TS_IP }}
          SSH_USER: ${{ secrets.USERNAME }}
        run: |
          set -euo pipefail

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          ssh_cmd="ssh -i $key_file -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          # uploads/ 에는 배포 유저가 아닌 root 소유 파일·디렉터리가 섞인다:
          # bind mount 경로를 docker 데몬(root)이 만들거나, 컨테이너가 root 로
          # 파일을 쓰거나, 과거에 docker cp 로 이미지를 넣었을 때 그렇게 된다.
          # 배포 유저는 root 소유 디렉터리 안에 임시 파일을 만들 수 없어서
          # rsync 가 mkstemp: Permission denied (13) → exit 23 으로 죽는다.
          # 그래서 rsync 전에 소유권을 배포 유저로 되돌린다. 백엔드 컨테이너는
          # root 로 돌기 때문에 소유권이 바뀌어도 앱의 업로드 쓰기에는 영향 없다.
          $ssh_cmd "$SSH_USER@$SSH_HOST" '
            set -e
            uploads="$HOME/workspace/neuti-site/backend/uploads"
            mkdir -p "$uploads"
            if [ -n "$(find "$uploads" ! -user "$(id -u)" -print -quit)" ]; then
              echo "uploads/ 에 다른 소유자의 파일이 있어 소유권을 정규화합니다"
              docker run --rm -v "$uploads:/uploads" busybox \
                chown -R "$(id -u):$(id -g)" /uploads \
                || { echo "ERROR: uploads 소유권 정규화 실패 (docker 실행 불가?)"; exit 1; }
            fi
          '

          rsync -az --stats -e "$ssh_cmd" \
            backend/uploads/ \
            "$SSH_USER@$SSH_HOST:workspace/neuti-site/backend/uploads/"

          # 저장소에서 사라진 시공사례 이미지 폴더를 서버에서도 정리한다.
          # 삭제 대상은 uploads/ 바로 아래 '디렉터리'뿐이다. 관리자 UI 업로드분은
          # upload_image() 가 uploads/ 최상위에 uuid.jpg 로 저장하는 '파일'이라
          # 이 로직에 절대 걸리지 않는다 (그래서 rsync --delete 를 쓰지 않는다).
          # comm 은 양쪽 입력이 '같은 기준'으로 정렬돼야 한다. 러너와 홈서버의
          # 로케일이 다르면 한글 정렬 순서가 어긋나 멀쩡한 폴더를 지울 수 있으므로
          # 양쪽 모두 LC_ALL=C (바이트 순) 로 고정한다.
          expected_dirs="$(find backend/uploads -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | LC_ALL=C sort)"
          printf '%s\n' "$expected_dirs" \
            | $ssh_cmd "$SSH_USER@$SSH_HOST" '
              set -e
              uploads="$HOME/workspace/neuti-site/backend/uploads"
              expected="$(mktemp)"
              trap '\''rm -f "$expected"'\'' EXIT
              LC_ALL=C sort > "$expected"
              find "$uploads" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | LC_ALL=C sort \
                | comm -23 - "$expected" \
                | while IFS= read -r stale; do
                    [ -n "$stale" ] || continue
                    echo "삭제(저장소에 없는 업로드 폴더): $stale"
                    rm -rf "${uploads:?}/${stale:?}"
                  done
            '

      - name: Deploy services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOMESERVER_TS_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/workspace/neuti-site

            # Validate .env
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found in ~/workspace/neuti-site"
              exit 1
            fi
            for var in POSTGRES_PASSWORD SECRET_KEY ADMIN_PASSWORD; do
              if ! grep -q "^${var}=" .env; then
                echo "ERROR: Required variable $var not found in .env"
                exit 1
              fi
            done

            mkdir -p backend/uploads

            # Tag current images for rollback
            docker tag localhost:5000/neuti-backend:latest localhost:5000/neuti-backend:previous 2>/dev/null || true
            docker tag localhost:5000/neuti-frontend:latest localhost:5000/neuti-frontend:previous 2>/dev/null || true

            # Pull and restart
            docker compose -f docker-compose.prod.yml pull neuti-backend neuti-frontend
            docker compose -f docker-compose.prod.yml up -d

            # Wait for health checks (backend start_period=30s)
            TIMEOUT=60
            ELAPSED=0
            echo "Waiting for services to become healthy..."
            while [ $ELAPSED -lt $TIMEOUT ]; do
              sleep 10
              ELAPSED=$((ELAPSED + 10))

              BACKEND_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' neuti-backend 2>/dev/null || echo "starting")
              FRONTEND_HEALTH=$(docker inspect --format='{{.State.Health.Status}}' neuti-frontend 2>/dev/null || echo "starting")

              echo "  [${ELAPSED}s] backend=${BACKEND_HEALTH} frontend=${FRONTEND_HEALTH}"

              if [ "$BACKEND_HEALTH" = "healthy" ] && [ "$FRONTEND_HEALTH" = "healthy" ]; then
                echo "All services healthy!"
                docker compose -f docker-compose.prod.yml ps
                docker image prune -f
                exit 0
              fi
            done

            echo "ERROR: Services not healthy within ${TIMEOUT}s"
            docker compose -f docker-compose.prod.yml logs --tail=30
            exit 1
