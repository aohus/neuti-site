services:
  neuti-backend:
    image: localhost:5000/neuti-backend:latest
    container_name: neuti-backend
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed_technology &&
             python -c 'import asyncio; from app.sync_md import sync_all_performances; asyncio.run(sync_all_performances())' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=neuti-db
      - PYTHONPATH=/app
    volumes:
      - ./backend/uploads:/app/uploads
      # 썸네일 캐시(/api/v1/thumb). uploads 밖에 둬야 배포의 폴더 정리에 지워지지 않는다
      - thumb_cache_prod:/app/thumb-cache
    restart: always
    expose:
      - "8000"
    depends_on:
      neuti-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

    labels:
      - "traefik.enable=true"

      # Backend API Router
      - "traefik.http.routers.neuti-backend.rule=Host(`XN--910B90BW7NHUBU9W9VR.COM`) && (PathPrefix(`/backend-api`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.neuti-backend.entrypoints=websecure"
      - "traefik.http.routers.neuti-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.neuti-backend.priority=10"

      # Rewrite /backend-api/* → /api/v1/*
      - "traefik.http.middlewares.neuti-rewrite.replacepathregex.regex=^/backend-api/(.*)"
      - "traefik.http.middlewares.neuti-rewrite.replacepathregex.replacement=/api/v1/$$1"
      - "traefik.http.routers.neuti-backend.middlewares=neuti-rewrite"

      # Service
      - "traefik.http.services.neuti-backend.loadbalancer.server.port=8000"

    networks:
      - neuti-internal
      - proxy-network

  neuti-frontend:
    image: localhost:5000/neuti-frontend:latest
    container_name: neuti-frontend
    environment:
      - NEXT_PUBLIC_API_URL=/backend-api
      - BACKEND_INTERNAL_URL=http://neuti-backend:8000
    volumes:
      # next/image 변환 캐시. 컨테이너를 새로 띄울 때마다 비면 배포 직후 홈 이미지가
      # CPU 0.5 개로 원본(최대 7MB)을 다시 변환하느라 장당 0.5~1초씩 늦게 뜬다.
      # images 만 붙인다 — .next/cache 통째면 이전 빌드의 fetch 캐시까지 살아남는다
      - next_image_cache_prod:/app/.next/cache/images
    restart: always
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://0.0.0.0:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

    labels:
      - "traefik.enable=true"

      # Frontend Router
      - "traefik.http.routers.neuti-frontend.rule=Host(`XN--910B90BW7NHUBU9W9VR.COM`)"
      - "traefik.http.routers.neuti-frontend.entrypoints=websecure"
      - "traefik.http.routers.neuti-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.neuti-frontend.priority=1"

      # 대표 도메인 통일 — www·.NET 은 같은 경로의 .COM 으로 301.
      # 같은 페이지가 여러 호스트로 색인되면 검색 점수가 갈라진다.
      - "traefik.http.routers.neuti-canonical-host.rule=Host(`XN--910B90BW7NHUBU9W9VR.NET`) || Host(`www.XN--910B90BW7NHUBU9W9VR.COM`) || Host(`www.XN--910B90BW7NHUBU9W9VR.NET`)"
      - "traefik.http.routers.neuti-canonical-host.entrypoints=websecure"
      - "traefik.http.routers.neuti-canonical-host.tls.certresolver=letsencrypt"
      - "traefik.http.routers.neuti-canonical-host.priority=100"
      - "traefik.http.routers.neuti-canonical-host.service=neuti-frontend"
      - "traefik.http.routers.neuti-canonical-host.middlewares=neuti-canonical-host"
      - "traefik.http.middlewares.neuti-canonical-host.redirectregex.regex=^https?://[^/]+/(.*)"
      - "traefik.http.middlewares.neuti-canonical-host.redirectregex.replacement=https://xn--910b90bw7nhubu9w9vr.com/$${1}"
      - "traefik.http.middlewares.neuti-canonical-host.redirectregex.permanent=true"

      # Service
      - "traefik.http.services.neuti-frontend.loadbalancer.server.port=3000"

    networks:
      - neuti-internal
      - proxy-network

  neuti-db:
    image: postgres:15-alpine
    container_name: neuti-db
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    networks:
      - neuti-internal

networks:
  neuti-internal:
    driver: bridge
  proxy-network:
    external: true

volumes:
  postgres_data_prod:
  thumb_cache_prod:
  next_image_cache_prod:
